<html>
    <head>
        <title>Bekerja dengan list</title>
    </head>
    <body>
        <hr>
        Ordered List
        <ol>
            <li>satu</li>
            <li>dua</li>
            <li>tiga</li>
        </ol>
        <hr>
        Unordered List
        <ul>
            <li>satu</li>
            <li>dua</li>
            <li>tiga</li>
        </ul>
        <hr
        definition list
        <dl>
            <dt>HTML</dt>
            <dd>Hypertext Markup Language</dd>
            <dt>CSS</dt>
            <dd>Cascading Style Sheet</dd>
        </dl>
        <hr>
    </body>
</html>
